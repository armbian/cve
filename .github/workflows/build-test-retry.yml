# Re-run the failed build-test jobs, up to 3 times (same idea as armbian/ci
# auto-retry-stalled.yml). Self-hosted runners sometimes stall or lose a
# cached tree; a real build error just fails again.

name: build-test-retry

on:
  workflow_run:
    workflows: [build-test]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 4
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Re-run failed jobs
        run: |
          echo "build-test run ${{ github.event.workflow_run.id }}, attempt ${{ github.event.workflow_run.run_attempt }}"
          gh run rerun ${{ github.event.workflow_run.id }} --failed --repo "$GITHUB_REPOSITORY"
