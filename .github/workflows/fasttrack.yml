name: kernel-security-fasttrack

# Hourly on a GitHub-hosted runner: pull sources (cached), gather + verify patches,
# drop what stable has absorbed, commit patches/ and the reports to main.
# On demand: resolve specific incidents, optionally letting Claude Code backport
# what does not apply; those arrive as a PR for review.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      incidents:
        description: "CVE ids (space separated), or 'unpatched' for every open issue"
        default: ""
      commit:
        description: "mainline fix SHA for an incident without a CVE record (optional)"
        default: ""
      claude:
        description: "let Claude Code backport what does not apply"
        type: boolean
        default: false
      retry:
        description: "run Claude again for CVEs it already tried (attempts.json)"
        type: boolean
        default: false

concurrency:
  group: fasttrack
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  fasttrack:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Same as armbian/shallow: linux.git and its worktrees need the space.
      - name: Free Github Runner
        uses: descriptinc/free-disk-space@main # no tagged releases; pinned to default branch
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false # fixed list fails when a package is missing (e.g. powershell on 26.04)
          docker-images: true
          swap-storage: true

      # Same as armbian/shallow#16: remove the large packages that are actually installed.
      - name: Remove large packages
        run: |
          pkgs=$(dpkg-query -W -f '${Package}\n' | grep -E '^(aspnetcore-|dotnet-|llvm-|php|mongodb-|mysql-)|^(azure-cli|google-chrome-stable|firefox|powershell|mono-devel|libgl1-mesa-dri|google-cloud-sdk|google-cloud-cli)$' || true)
          [[ -n "$pkgs" ]] && sudo apt-get remove -y $pkgs
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h /

      # No token in .git/config: Claude runs in this job. Push steps set it themselves.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Tooling
        run: |
          pip install --quiet pyyaml
          git config --global user.name  "fasttrack[bot]"
          git config --global user.email "fasttrack@users.noreply.github.com"

      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # data/ = shallow linux.git + vulns.git + stable-queue.git. A new entry is
      # saved once per ISO week; runs in between restore the latest one and only
      # fetch what is new. Editing fasttrack.yaml (e.g. the series) starts fresh.
      - name: Upstream data cache
        uses: actions/cache@v4
        with:
          path: data
          key: data-${{ hashFiles('fasttrack.yaml') }}-${{ steps.week.outputs.week }}
          restore-keys: data-${{ hashFiles('fasttrack.yaml') }}-

      - name: Sync
        run: python3 -m fasttrack.cli -v sync

      - name: Gather and verify
        id: run
        run: |
          python3 -m fasttrack.cli -v run
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      # patches/ is rebuilt from scratch by `run`, so fixes stable has absorbed are
      # already gone from it. prune does the same for incident results under cve/.
      - name: Drop incident patches stable has absorbed
        run: python3 -m fasttrack.cli -v prune

      - name: Commit patches and reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # One path at a time: a path that does not exist fails the whole `git add`.
          for p in patches cve report.md unpatched.json state.json events.json cve-report.md cve-result.json; do
            git add -A -- "$p" 2>/dev/null || true
          done
          if ! git diff --cached --quiet; then
            git commit -q -m "patches: $(date -u '+%F %H:%M')" \
              -m "$(grep -E '^- ' report.md | head -20)"
            git pull -q --rebase origin "$GITHUB_REF_NAME"
            git push -q origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Install Claude Code
        if: github.event_name == 'workflow_dispatch' && inputs.claude
        run: npm install -g @anthropic-ai/claude-code

      - name: Resolve incidents
        if: github.event_name == 'workflow_dispatch' && (inputs.incidents != '' || inputs.commit != '')
        # Claude runs here: no GitHub token in this step.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args=()
          if [ "${{ inputs.incidents }}" = "unpatched" ]; then args+=(--unpatched); else args+=(${{ inputs.incidents }}); fi
          [ -n "${{ inputs.commit }}" ] && args+=(--commit "${{ inputs.commit }}")
          if [ "${{ inputs.claude }}" = "true" ]; then args+=(--claude); else args+=(--adapt --package); fi
          [ "${{ inputs.retry }}" = "true" ] && args+=(--retry)
          python3 -m fasttrack.cli -v cve "${args[@]}" || true
          cat cve-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish incident results
        if: github.event_name == 'workflow_dispatch' && (inputs.incidents != '' || inputs.commit != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # The attempt record goes to main, so no later run pays for the same CVE.
          if [ -f attempts.json ]; then
            git add attempts.json
            if ! git diff --cached --quiet; then
              git commit -q -m "attempts: Claude run ${{ github.run_id }}"
              git pull -q --rebase --autostash origin "$GITHUB_REF_NAME"
              git push -q origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi
          # Incident results always go through review, never straight to main.
          br="incident/${{ github.run_id }}"
          git checkout -q -b "$br"
          git add -A cve cve-report.md cve-result.json
          if ! git diff --cached --quiet; then
            git commit -q -m "cve: incident patches for review (run ${{ github.run_id }})"
            git push -q origin "$br"
            gh pr create --head "$br" --base "$GITHUB_REF_NAME" --label security \
              --title "Incident patches for review (run ${{ github.run_id }})" --body-file cve-report.md
          fi

      - name: Keep work packages (BRIEF.md, RESULT.md, claude.log)
        if: always() && hashFiles('work/**/BRIEF.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: work-${{ github.run_id }}
          path: |
            work/
            !work/*/*/tree

      - name: Raise actively exploited CVEs
        if: steps.run.outputs.kev == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --label security --title "Actively exploited kernel CVE pending" \
            --body "$(grep -E '^- kev' report.md)

          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Same as armbian/docker-armbian-build: stop GitHub from disabling the hourly
  # schedule after 60 days without repository activity (quiet weeks commit nothing).
  keepalive:
    if: ${{ github.repository_owner == 'armbian' }}
    name: Keep Alive
    needs: fasttrack
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: liskin/gh-workflow-keepalive@v1
