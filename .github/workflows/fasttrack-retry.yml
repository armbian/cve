# Re-run the failed fasttrack jobs, up to 3 times. git.kernel.org sometimes
# refuses GitHub runners for longer than the retries in sync cover. Wait first:
# an instant re-run meets the same outage. A real error just fails again.

name: fasttrack-retry

on:
  workflow_run:
    workflows: [kernel-security-fasttrack]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    # Scheduled and push runs only: a manual run can spend the Claude API key.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 4 &&
      contains(fromJSON('["schedule", "push"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for the network
        run: sleep 600
      - name: Re-run failed jobs
        run: |
          echo "fasttrack run ${{ github.event.workflow_run.id }}, attempt ${{ github.event.workflow_run.run_attempt }}"
          gh run rerun ${{ github.event.workflow_run.id }} --failed --repo "$GITHUB_REPOSITORY"
