name: tests

# Unit tests of the fasttrack tool. No secrets, read-only token.
on:
  pull_request:
    paths: ["fasttrack/**", "tests/**", "scripts/**", "fasttrack.yaml"]
  push:
    branches: [main]
    paths: ["fasttrack/**", "tests/**", "scripts/**", "fasttrack.yaml"]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tooling
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          git config --global user.email t@t
          git config --global user.name t
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
