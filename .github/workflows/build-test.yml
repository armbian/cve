name: build-test

# Compile-test every patch series per architecture: apply it on its stable base,
# build the changed .c files with allmodconfig. Fails on build errors.
# Pushes by the hourly fasttrack job do not start it (GITHUB_TOKEN); merges do.

on:
  pull_request:
    paths: ["cve/**", "patches/**", "scripts/build-test.sh", ".github/workflows/build-test.yml"]
  push:
    branches: [main]
    paths: ["cve/**", "patches/**", "scripts/build-test.sh", ".github/workflows/build-test.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Repo variable FASTTRACK_RUNNER picks a self-hosted runner (label); default GitHub-hosted.
    runs-on: ${{ vars.FASTTRACK_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm, riscv, x86]
    steps:
      - uses: actions/checkout@v4

      # Cross compilers for the other three arches; the host arch builds natively.
      - name: Toolchain
        run: |
          need=""
          for t in aarch64-linux-gnu arm-linux-gnueabihf riscv64-linux-gnu x86_64-linux-gnu; do
            [ "$t" = "$(uname -m)-linux-gnu" ] && continue
            command -v "$t-gcc" >/dev/null || need="$need gcc-${t//_/-}"
          done
          command -v bison flex bc pahole >/dev/null && [ -e /usr/include/libelf.h ] && [ -z "$need" ] && exit 0
          sudo apt-get update -q
          sudo apt-get install -y -q bc bison flex dwarves libelf-dev libssl-dev $need

      # Self-hosted: kernel tree and prepared builds stay between runs.
      - name: Build test
        run: |
          [ "${{ runner.environment }}" = self-hosted ] && export WORK="$HOME/.cache/armbian-cve/build-test-${{ matrix.arch }}"
          ret=0
          scripts/build-test.sh ${{ matrix.arch }} || ret=$?
          mkdir -p build-test && cp -r "${WORK:-build-test}/logs" build-test/ 2>/dev/null || true
          exit $ret

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-test-${{ matrix.arch }}
          path: build-test/logs
