name: build-test

# Compile-test every patch series per architecture: apply it on its stable base,
# build the changed .c files with allmodconfig. Fails on build errors.
# Each arch is split over up to 32 shards.
# Bot merges start it when they use the armbianworker token, not GITHUB_TOKEN.
# A change to this file starts no run; use workflow_dispatch to test it.

on:
  pull_request:
    paths: ["cve/**", "patches/**", "scripts/build-test.sh"]
  push:
    branches: [main]
    paths: ["cve/**", "patches/**", "scripts/build-test.sh"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PR and push test only the series they change. A new branch or a dispatch tests all.
  # One shard per series, at most 32, so a small change starts few jobs.
  plan:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.plan.outputs.dirs }}
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        run: |
          since=""
          case "${{ github.event_name }}" in
            pull_request) since="origin/${{ github.base_ref }}..." ;;
            push) git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null && since="${{ github.event.before }}.." ;;
          esac
          dirs=() changed=""
          [ -z "$since" ] || changed=$(git diff --name-only "${since}HEAD")
          if [ -n "$since" ] && ! grep -qx 'scripts/build-test.sh' <<<"$changed"; then
            for d in $(grep -oE '^(cve/[^/]+/[^/]+|patches/[^/]+)/' <<<"$changed" | sort -u); do
              [ -f "$d/base" ] && dirs+=("${d%/}")
            done
            n=${#dirs[@]}
          else
            n=$(ls -d cve/*/*/base patches/*/base 2>/dev/null | wc -l)
          fi
          [ "$n" -le 32 ] || n=32
          echo "dirs=${dirs[*]}" >>"$GITHUB_OUTPUT"
          echo "count=$n" >>"$GITHUB_OUTPUT"
          echo "shards=[$(seq -s, 0 $((n - 1)))]" >>"$GITHUB_OUTPUT"
          echo "${#dirs[@]} changed series (none: all); $n shard(s)"

  build:
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    # Repo variable BUILDTEST_RUNNER picks a self-hosted runner (label); default GitHub-hosted.
    runs-on: ${{ vars.BUILDTEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm, riscv, x86]
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Cross compilers for the other three arches; the host arch builds natively.
      - name: Toolchain
        run: |
          need=""
          for t in aarch64-linux-gnu arm-linux-gnueabihf riscv64-linux-gnu x86_64-linux-gnu; do
            [ "$t" = "$(uname -m)-linux-gnu" ] && continue
            command -v "$t-gcc" >/dev/null || need="$need gcc-${t//_/-}"
          done
          command -v bison flex bc pahole >/dev/null && [ -e /usr/include/libelf.h ] && [ -z "$need" ] && exit 0
          sudo apt-get update -q
          sudo apt-get install -y -q bc bison flex dwarves libelf-dev libssl-dev $need

      # Self-hosted: kernel tree and prepared builds stay between runs, one cache per runner.
      - name: Build test
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.count }}
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            # One cache per runner for all arches; the old per-arch caches go.
            rm -rf "$HOME/.cache/armbian-cve/$RUNNER_NAME"/build-test-*
            export WORK="$HOME/.cache/armbian-cve/$RUNNER_NAME/build-test"
          fi
          read -ra dirs <<<"${{ needs.plan.outputs.dirs }}"
          ret=0
          scripts/build-test.sh ${{ matrix.arch }} "${dirs[@]}" || ret=$?
          mkdir -p build-test && cp -r "${WORK:-build-test}/logs" build-test/ 2>/dev/null || true
          exit $ret

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-test-${{ matrix.arch }}-${{ matrix.shard }}
          path: build-test/logs
